<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan · Do · See</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    /* ---- 최종 확정: 차분한 톤 + 딥 에메랄드 포인트 ---- */
    --paper:#faf9f5; --surface:#ffffff; --surface-2:#f2efe7;
    --ink:#1b1a15; --ink-soft:#6a6656; --ink-faint:#a49e8b;
    --line:#e7e2d3; --line-strong:#d6cfb9;
    --accent:#1f6d4c; --accent-ink:#164f38; --accent-tint:#e7f2ec; --accent-tint-strong:#cde6da;
    --gold:#a9862f; --gold-tint:#f5eede;
    --good:#1f6d4c; --good-tint:#e7f2ec;
    --warn:#a9862f; --warn-tint:#f5eede;
    --bad:#963c33; --bad-tint:#f3e6e3;
    --font-ui: "PretendardVariable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-ui);
    background:var(--paper);color:var(--ink);line-height:1.65;font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-ui);font-weight:700;letter-spacing:-.02em;margin:0}
  p{margin:0}
  ::selection{background:var(--accent-tint-strong)}

  /* ---------- 페이지 뼈대 ---------- */
  .shell{max-width:1180px;margin:0 auto;padding:28px 24px 60px}

  .hero{
    margin:-28px -24px 0;padding:34px 24px 8px;
    background:linear-gradient(160deg, var(--accent-tint) 0%, var(--gold-tint) 55%, rgba(250,249,245,0) 100%);
  }

  .brand{display:flex;align-items:center;gap:11px}
  .brand svg{flex-shrink:0}

  .topline{
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
    margin-bottom:6px;flex-wrap:wrap;
  }
  .topline h1{font-size:1.75rem;letter-spacing:-.025em}
  .topline .flow{font-size:.82rem;color:var(--ink-soft);margin-top:4px}

  .notice{
    display:flex;gap:7px;align-items:flex-start;
    font-size:.82rem;color:var(--warn);margin:12px 0 24px;padding-left:1px;
  }
  .notice svg{flex-shrink:0;margin-top:2px}
  .notice span{color:var(--ink-soft)}

  .app{display:grid;grid-template-columns:250px 1fr;gap:32px;align-items:start}
  @media (max-width:860px){ .app{grid-template-columns:1fr} }

  #global-err{grid-column:1/-1}

  /* ---------- 왼쪽 레일: 계획 목록 ---------- */
  .rail-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;
  }
  .rail-head .label{font-size:.76rem;color:var(--ink-faint);letter-spacing:.04em}
  .rail-list{display:flex;flex-direction:column;gap:3px}
  @media (max-width:860px){
    .rail-list{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
    .rail-list::-webkit-scrollbar{height:0}
  }

  .rail-item{
    display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
    padding:10px 12px;border-radius:8px;border-left:2px solid transparent;
    font-family:inherit;color:var(--ink-soft);transition:.15s;
  }
  .rail-item:hover{background:var(--surface-2)}
  .rail-item.active{background:var(--surface);border-left-color:var(--accent);color:var(--ink);
    box-shadow:0 1px 8px -3px rgba(31,109,76,.18);border:1px solid var(--line)}
  .rail-item .t{font-size:.9rem;font-weight:600;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rail-item .m{font-size:.71rem;color:var(--ink-faint);margin-top:4px;font-family:var(--font-mono)}
  @media (max-width:860px){
    .rail-item{width:auto;white-space:nowrap;flex-shrink:0;border-left:none;border-bottom:2px solid transparent}
    .rail-item.active{border-bottom-color:var(--accent)}
    .rail-item .t{-webkit-line-clamp:1}
  }

  .rail-empty{font-size:.82rem;color:var(--ink-faint);padding:8px 2px;line-height:1.6}

  /* ---------- 공통 버튼 ---------- */
  button{font-family:inherit;cursor:pointer;border-radius:8px;font-weight:600;border:1px solid transparent;color:var(--ink)}
  button:disabled{opacity:.45;cursor:not-allowed}

  .btn-text{background:none;border:none;color:var(--accent);font-size:.83rem;padding:4px 2px;font-weight:600}
  .btn-text:hover{text-decoration:underline}

  .btn{background:var(--accent);color:#fff;padding:9px 18px;font-size:.87rem;border-radius:9px;
    transition:transform .14s,box-shadow .14s,background .14s;box-shadow:0 1px 2px rgba(22,79,56,.15)}
  .btn:hover{background:var(--accent-ink);box-shadow:0 6px 18px -5px rgba(31,109,76,.45);transform:translateY(-1px)}

  .btn-line{background:var(--surface);color:var(--ink);border-color:var(--line-strong);padding:7px 14px;font-size:.82rem;border-radius:8px}
  .btn-line:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}

  .btn-sm{background:none;color:var(--ink-soft);border:none;padding:4px 9px;font-size:.78rem;border-radius:6px}
  .btn-sm:hover{color:var(--accent);background:var(--accent-tint)}

  .btn-danger-sm{background:none;color:var(--ink-faint);border:none;padding:4px 9px;font-size:.78rem;border-radius:6px}
  .btn-danger-sm:hover{color:var(--bad);background:var(--bad-tint)}

  /* ---------- 폼 ---------- */
  label{display:block;font-size:.79rem;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
  input,select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;
    font-size:.89rem;font-family:inherit;background:var(--surface);color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  textarea{resize:vertical}
  .fg{margin-bottom:12px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .req{color:var(--bad)}

  /* ---------- 상태 점 ---------- */
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;flex-shrink:0}
  .dot-HIGH{background:var(--bad)} .dot-MEDIUM{background:var(--warn)} .dot-LOW{background:var(--ink-faint)}
  .dot-late{background:var(--bad)} .dot-block{background:var(--warn)} .dot-done{background:var(--good)}
  .meta-field{display:inline-flex;align-items:center;font-size:.78rem;color:var(--ink-soft)}

  .tag{color:var(--accent);font-size:.75rem;margin-right:10px;font-weight:600}
  .tag::before{content:"#"}

  /* ---------- 메인 패널: 계획 헤더 ---------- */
  #plan-header{margin-bottom:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:24px 26px;box-shadow:0 2px 16px -8px rgba(27,26,21,.1)}
  .plan-header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .plan-header h2{font-size:1.4rem;line-height:1.3}
  .plan-header .desc{font-size:.87rem;color:var(--ink-soft);white-space:pre-wrap;margin-top:9px;max-width:62ch}
  .plan-header .criteria{font-size:.85rem;color:var(--ink);margin-top:14px;padding:12px 15px;background:var(--surface-2);
    border-left:2px solid var(--gold);border-radius:0 8px 8px 0}
  .plan-header .criteria b{font-weight:700;color:var(--gold);font-size:.71rem;display:block;margin-bottom:3px;letter-spacing:.02em}
  .plan-header-acts{display:flex;gap:2px;flex-shrink:0}

  .plan-meta-row{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;font-size:.79rem;color:var(--ink-soft);font-family:var(--font-mono)}
  .plan-meta-row b{color:var(--ink);font-weight:600}

  .progress-row{display:flex;align-items:center;gap:10px;margin-top:16px;max-width:360px}
  .progress-track{flex:1;height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .4s ease}
  .progress-pct{font-family:var(--font-mono);font-size:.74rem;color:var(--ink-soft);flex-shrink:0;min-width:30px;text-align:right}

  .carried{
    font-size:.81rem;color:var(--accent-ink);background:var(--accent-tint);
    padding:9px 13px;border-radius:8px;margin-top:14px;
  }

  /* ---------- 탭 ---------- */
  .tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .tab-btn{
    background:none;border:none;border-bottom:2px solid transparent;
    padding:9px 1px 12px;font-size:.91rem;color:var(--ink-faint);font-weight:600;border-radius:0;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--accent)}
  .tab-btn:hover{color:var(--ink)}

  .tab-panel{display:none}
  .tab-panel.active{display:block;animation:tabIn .22s ease}
  @keyframes tabIn{ from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .panel-head h3{font-size:1.02rem}

  /* ---------- 할 일 도구줄 ---------- */
  .toolbar{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:8px;margin-bottom:12px}
  @media (max-width:680px){ .toolbar{grid-template-columns:1fr 1fr} }
  .search-wrap{position:relative}
  .search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
  .search-wrap input{padding-left:30px}

  .sort-note{font-size:.76rem;color:var(--ink-faint);margin-bottom:14px;line-height:1.7}
  .sort-note b{color:var(--ink-soft);font-weight:600}
  .sort-note .drill-tag{color:var(--accent);font-weight:600}

  /* ---------- 할 일 목록 ---------- */
  .task-list{border-top:1px solid var(--line)}
  .task{padding:14px 4px 14px 14px;border-bottom:1px solid var(--line);border-left:3px solid transparent;transition:background .14s}
  .task:hover{background:var(--surface-2)}
  .task.pri-HIGH{border-left-color:var(--bad)}
  .task.pri-MEDIUM{border-left-color:var(--warn)}
  .task.pri-LOW{border-left-color:var(--line-strong)}
  .task.done{border-left-color:var(--good)}
  .task.done .task-text{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--line-strong)}
  .task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .task-text{font-size:.93rem;font-weight:600;word-break:break-word;display:flex;align-items:flex-start;gap:9px}
  .check{
    width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);flex-shrink:0;margin-top:2px;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .check.on{background:var(--good);border-color:var(--good)}
  .task-meta{font-size:.76rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:8px;margin-left:25px;align-items:center;font-family:var(--font-mono)}
  .task-acts{display:flex;gap:2px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

  .logs{margin-top:9px;margin-left:25px}
  .log{font-size:.79rem;color:var(--ink-soft);padding:9px 0;border-top:1px dotted var(--line-strong)}
  .log-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .log-content{font-weight:600;color:var(--ink);margin-bottom:2px}
  .log-blk{color:var(--warn);display:block;margin-top:2px}

  /* ---------- 돌아보기: 집계 ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 10px -6px rgba(27,26,21,.1)}
  @media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .stat{background:var(--surface);padding:16px 14px;text-align:left;border:none;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s,background .15s;position:relative;z-index:1}
  .stat:hover{background:var(--accent-tint);transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(31,109,76,.32);z-index:2}
  .stat .n{font-family:var(--font-mono);font-size:1.7rem;font-weight:700;line-height:1;color:var(--accent)}
  .stat .l{font-size:.78rem;color:var(--ink-soft);margin-top:6px}
  .stat .hint{font-size:.68rem;color:var(--ink-faint);margin-top:2px}

  .hours-row{display:flex;gap:28px;flex-wrap:wrap;margin:16px 2px 18px;font-size:.84rem}
  .hours-row .h-item .n{font-family:var(--font-mono);font-size:1.1rem;font-weight:600;color:var(--ink)}
  .hours-row .h-item .l{color:var(--ink-soft);font-size:.76rem;margin-top:2px}

  .rule-note{font-size:.77rem;color:var(--ink-faint);margin-bottom:22px;line-height:1.7}

  /* ---------- 회고 ---------- */
  .retro-form-wrap{padding-top:18px;border-top:1px solid var(--line)}
  .retro-form-wrap h4{font-family:var(--font-ui);font-size:.86rem;font-weight:600;color:var(--ink-soft);margin-bottom:12px}

  .retro-item{padding:12px 0;border-bottom:1px solid var(--line);font-size:.85rem}
  .retro-item .when{font-size:.73rem;color:var(--ink-faint);margin-bottom:3px;font-family:var(--font-mono)}
  .retro-item .status{font-weight:600}
  .retro-item .reflection{color:var(--ink-soft);margin-top:5px}
  .retro-next{
    margin-top:9px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    font-size:.82rem;color:var(--good);
  }
  .retro-actions{display:flex;gap:2px;align-items:center;flex-shrink:0}
  .retro-actions .btn-sm{padding:3px 8px}
  .retro-actions .btn-danger-sm{padding:3px 8px}

  /* ---------- 모달 ---------- */
  .modal-bg{
    position:fixed;inset:0;background:rgba(33,31,27,.42);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:50;
  }
  .modal-bg.open{display:flex}
  .modal{background:var(--surface);border-radius:16px;padding:26px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 48px -14px rgba(27,26,21,.26), 0 4px 14px -6px rgba(31,109,76,.12);
    border-top:3px solid var(--gold)}
  .modal h3{font-size:1.1rem;margin-bottom:4px}
  .modal .msub{font-size:.81rem;color:var(--ink-soft);margin-bottom:16px}
  .modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

  .empty{color:var(--ink-faint);font-size:.86rem;padding:26px 4px;line-height:1.7}
  .err{
    background:var(--bad-tint);color:var(--bad);
    padding:9px 12px;border-radius:6px;font-size:.83rem;margin-bottom:10px;
  }
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:7px;font-size:.85rem;
    z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1}
  .toast.bad{background:var(--bad)}
  .loading{color:var(--ink-faint);font-size:.84rem;padding:18px 2px}

  .hist{font-size:.83rem;border-left:2px solid var(--line-strong);padding:8px 12px;margin-bottom:10px}
  .hist .when{font-size:.72rem;color:var(--ink-faint);margin-bottom:4px;font-family:var(--font-mono)}

  .hidden{display:none !important}

  @media(max-width:640px){
    .shell{padding:20px 16px 48px}
    .task-head{flex-direction:column}
    .task-acts{justify-content:flex-start;margin-left:23px}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="hero">
  <div class="topline">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
        <path d="M16 6 A10 10 0 1 1 6.8 12" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M6.8 12 L5 8.5 L10 9.3 Z" fill="var(--accent)"/>
        <circle cx="16" cy="6" r="3.4" fill="var(--accent)"/>
        <circle cx="24.5" cy="19" r="3.4" fill="var(--accent)" opacity=".55"/>
        <circle cx="8.2" cy="19" r="3.4" fill="var(--accent)" opacity=".3"/>
      </svg>
      <h1>Plan · Do · See</h1>
    </div>
    <button class="btn-line" onclick="exportAll()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:5px"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
      내 자료 내보내기
    </button>
  </div>

  <p class="notice">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
    <span>지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다. 남이 봐도 괜찮은 내용만 넣으세요.</span>
  </p>
  </div>

  <div id="global-err"></div>

  <div class="app">
    <!-- ========== 왼쪽 레일: 계획 목록 ========== -->
    <aside>
      <div class="rail-head">
        <span class="label">계획</span>
        <button class="btn-text" onclick="openPlanModal()">+ 새 계획</button>
      </div>
      <div class="rail-list" id="plan-list"><div class="loading">불러오는 중…</div></div>
    </aside>

    <!-- ========== 메인 ========== -->
    <main>
      <div id="plan-header"></div>

      <div id="panels" class="hidden">
        <div class="tabs">
          <button class="tab-btn active" id="tab-do-btn" onclick="switchTab('do')">할 일과 실행 기록</button>
          <button class="tab-btn" id="tab-see-btn" onclick="switchTab('see')">돌아보기</button>
        </div>

        <!-- ---- DO ---- -->
        <section class="tab-panel active" id="panel-do">
          <div class="panel-head">
            <div class="search-wrap" style="flex:1;min-width:180px;max-width:280px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input type="search" id="f-q" placeholder="내용·태그 검색" oninput="debouncedLoadTasks()">
            </div>
            <button class="btn-line" onclick="openTaskModal()">+ 새 할 일</button>
          </div>

          <div class="toolbar">
            <div></div>
            <select id="f-status" onchange="loadTasks()">
              <option value="">상태 — 전체</option>
              <option value="todo">진행 중만</option>
              <option value="done">완료만</option>
              <option value="delayed">지연된 것만</option>
              <option value="blocked">막힌 것만</option>
            </select>
            <select id="f-priority" onchange="loadTasks()">
              <option value="">우선순위 — 전체</option>
              <option value="HIGH">높음</option>
              <option value="MEDIUM">보통</option>
              <option value="LOW">낮음</option>
            </select>
            <select id="f-sort" onchange="loadTasks()">
              <option value="created_desc">만든 날짜 최신순</option>
              <option value="created_asc">만든 날짜 오래된순</option>
              <option value="due_asc">마감일 빠른순</option>
              <option value="due_desc">마감일 늦은순</option>
              <option value="priority_desc">우선순위 높은순</option>
              <option value="priority_asc">우선순위 낮은순</option>
              <option value="estimated_desc">예상 시간 많은순</option>
              <option value="estimated_asc">예상 시간 적은순</option>
            </select>
          </div>

          <!-- 정렬 기준을 화면에 밝혀 둔다 (T06-C20) -->
          <div class="sort-note" id="sort-note"></div>

          <div class="task-list" id="task-list"></div>
        </section>

        <!-- ---- SEE ---- -->
        <section class="tab-panel" id="panel-see">
          <div id="summary-area"><div class="loading">집계 중…</div></div>

          <div class="retro-form-wrap">
            <h4>회고 남기기</h4>

    <h3>계획 수정 이력</h3>

    <div id="hist-body"><div class="loading">불러오는 중…</div></div>
    <div class="modal-acts"><button class="btn-line" onclick="closeModal('hist-modal')">닫기</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   플랜두씨 다이어리 — 화면 로직
   모든 자료는 /api/* 를 거쳐 서버 데이터베이스에 저장된다.
   브라우저에는 아무것도 보관하지 않으므로 새로고침하면 서버 값이 그대로 다시 온다.
   ============================================================ */

/* ---------- 화면에 글자를 넣을 때는 반드시 이 함수를 거친다 (T06-C57) ----------
   저장된 값에 <script> 같은 글자가 들어 있어도 실행되지 않고 글자 그대로 보인다. */
function esc(v){
  if(v==null) return '';
  return String(v).replace(/[&<>"'`=\/]/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',
    '`':'&#96;','=':'&#61;','/':'&#47;'
  }[c]));
}

const state = {
  plans: [],
  currentPlanId: null,
  activeTab: 'do',           // 'do' | 'see'
  tasks: [],
  summary: null,
  retros: [],
  expandedLogs: new Set(),   // 실행 기록을 펼쳐 둔 할 일
  logsByTask: {},            // taskId -> 마지막으로 불러온 실행 기록 배열 (수정 모달 채우기용)
  drillIds: null,            // 집계 숫자를 눌러 좁혀 본 id 목록
  drillLabel: '',
};

/* ---------- 서버와 이야기하기 ---------- */
async function api(path, options = {}){
  const res = await fetch(path, {
    headers:{'Content-Type':'application/json'},
    ...options,
  });
  let data = null;
  try{ data = await res.json(); }catch{ /* 본문이 없을 수 있다 */ }

  if(!res.ok){
    const msg = data?.error?.message || `요청이 실패했습니다. (${res.status})`;
    const err = new Error(msg);
    err.code = data?.error?.code;
    err.status = res.status;
    throw err;
  }
  return data;
}

function toast(msg, bad=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.className='toast'; }, 2600);
}

function showErr(containerId, msg){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = msg ? `<div class="err">${esc(msg)}</div>` : '';
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

/* 서울 기준 오늘 (화면에서 기본값을 채울 때만 쓴다. 지연 판정은 서버가 한다.) */
function seoulToday(){
  return new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Seoul'});
}

function fmtDateTime(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleString('ko-KR', {
    timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit'
  });
}

const PRIORITY_LABEL = {HIGH:'높음', MEDIUM:'보통', LOW:'낮음'};

/* ============================================================
   탭 전환 (DO / SEE)
   ============================================================ */
function switchTab(name){
  state.activeTab = name;
  document.getElementById('tab-do-btn').classList.toggle('active', name === 'do');
  document.getElementById('tab-see-btn').classList.toggle('active', name === 'see');
  document.getElementById('panel-do').classList.toggle('active', name === 'do');
  document.getElementById('panel-see').classList.toggle('active', name === 'see');
}

/* ============================================================
   1. 계획
   ============================================================ */
async function loadPlans(){
  try{
    const data = await api('/api/plans');
    state.plans = data.plans || [];
    renderPlans();

    // 고르지 않았다면 첫 계획을 자동으로 편다.
    if(!state.currentPlanId && state.plans.length > 0){
      selectPlan(state.plans[0].id);
    } else if(state.plans.length === 0){
      document.getElementById('panels').classList.add('hidden');
      document.getElementById('plan-header').innerHTML = '';
    }
  }catch(e){
    showErr('global-err', `계획을 불러오지 못했습니다. ${e.message}`);
    document.getElementById('plan-list').innerHTML =
      '<div class="empty">계획을 불러오지 못했습니다. 새로고침해 보세요.</div>';
  }
}

/* 왼쪽 레일 — 고르는 용도만. 상세 내용은 plan-header 에 따로 보여준다. */
function renderPlans(){
  const el = document.getElementById('plan-list');
  if(state.plans.length === 0){
    el.innerHTML = '<div class="rail-empty">아직 계획이 없습니다.<br>지금 실제로 하고 있는 일 하나를 옮겨 보세요.</div>';
    return;
  }

  el.innerHTML = state.plans.map(p => `
    <button class="rail-item ${p.id === state.currentPlanId ? 'active' : ''}" onclick="selectPlan('${esc(p.id)}')">
      <div class="t">${esc(p.title)}</div>
      <div class="m">${esc(p.startDate)} ~ ${esc(p.endDate)} · 할 일 ${Number(p.taskCount)}개</div>
    </button>
  `).join('');
}

/* 오른쪽 상단 — 선택된 계획의 상세 정보와 조작 버튼. */
function renderPlanHeader(p){
  const el = document.getElementById('plan-header');
  if(!p){ el.innerHTML = ''; return; }

  el.innerHTML = `
    <div class="plan-header">
      <div class="plan-header-top">
        <h2>${esc(p.title)}</h2>
        <div class="plan-header-acts">
          <button class="btn-sm" onclick="showHistory('${esc(p.id)}')">수정 이력</button>
          <button class="btn-sm" onclick="openPlanModal('${esc(p.id)}')">수정</button>
          <button class="btn-danger-sm" onclick="deletePlan('${esc(p.id)}')">삭제</button>
        </div>
      </div>
      ${p.content ? `<div class="desc">${esc(p.content)}</div>` : ''}
      <div class="criteria"><b>성공 기준</b>${esc(p.successCriteria)}</div>
      <div class="plan-meta-row">
        <span>기간 <b>${esc(p.startDate)} ~ ${esc(p.endDate)}</b></span>
        <span><span class="dot dot-${esc(p.priority)}"></span>${esc(PRIORITY_LABEL[p.priority] || p.priority)}</span>
        <span>예상 <b>${Number(p.estimatedHours)}시간</b></span>
        <span>할 일 <b>${Number(p.taskCount)}개</b> · 완료 <b>${Number(p.completedCount)}개</b></span>
      </div>
      ${p.taskCount > 0 ? `
        <div class="progress-row">
          <div class="progress-track"><div class="progress-fill" style="width:${Math.round(p.completedCount / p.taskCount * 100)}%"></div></div>
          <span class="progress-pct">${Math.round(p.completedCount / p.taskCount * 100)}%</span>
        </div>` : ''}
      ${p.carriedFromActionItem ? `<div class="carried">지난 돌아보기에서 넘어온 고칠 점 — ${esc(p.carriedFromActionItem)}</div>` : ''}
    </div>
  `;
}

function selectPlan(id){
  state.currentPlanId = id;
  state.drillIds = null;
  state.expandedLogs.clear();
  renderPlans();

  const plan = state.plans.find(p => p.id === id);
  renderPlanHeader(plan);
  document.getElementById('panels').classList.remove('hidden');
  switchTab(state.activeTab || 'do');

  // 회고 기간 기본값을 계획 기간으로 채워 둔다.
  if(plan){
    document.getElementById('r-start').value = plan.startDate;
    document.getElementById('r-end').value = plan.endDate;
  }

  loadTasks();
  loadSummary();
  loadRetros();
}

function openPlanModal(id = null, fromRetroId = null){
  showErr('plan-modal-err', '');
  document.getElementById('plan-form').reset();
  document.getElementById('p-id').value = id || '';
  document.getElementById('p-from-retro').value = fromRetroId || '';

  if(id){
    const p = state.plans.find(x => x.id === id);
    if(!p) return;
    document.getElementById('plan-modal-title').textContent = '계획 수정';
    document.getElementById('plan-modal-sub').textContent =
      '고치기 전 계획은 수정 이력에 그대로 남습니다.';
    document.getElementById('p-title').value = p.title;
    document.getElementById('p-content').value = p.content || '';
    document.getElementById('p-start').value = p.startDate;
    document.getElementById('p-end').value = p.endDate;
    document.getElementById('p-priority').value = p.priority;
    document.getElementById('p-hours').value = p.estimatedHours;
    document.getElementById('p-success').value = p.successCriteria;
  }else{
    document.getElementById('plan-modal-title').textContent = '새 계획';
    document.getElementById('plan-modal-sub').textContent = fromRetroId
      ? '돌아보기에서 정한 고칠 점을 이어받아 다음 계획을 세웁니다.'
      : '지금 실제로 하고 있는 일 하나를 계획으로 옮겨 적으세요.';
    const today = seoulToday();
    document.getElementById('p-start').value = today;
    document.getElementById('p-end').value = today;
    document.getElementById('p-hours').value = 0;
  }
  openModal('plan-modal');
}

async function savePlan(e){
  e.preventDefault();
  const btn = document.getElementById('p-submit');
  btn.disabled = true;
  showErr('plan-modal-err', '');

  const id = document.getElementById('p-id').value;
  const fromRetro = document.getElementById('p-from-retro').value;

  const body = {
    title: document.getElementById('p-title').value,
    content: document.getElementById('p-content').value,
    startDate: document.getElementById('p-start').value,
    endDate: document.getElementById('p-end').value,
    priority: document.getElementById('p-priority').value,
    estimatedHours: parseFloat(document.getElementById('p-hours').value) || 0,
    successCriteria: document.getElementById('p-success').value,
  };
  if(fromRetro) body.fromRetrospectiveId = fromRetro;

  try{
    if(id){
      const r = await api(`/api/plans?id=${encodeURIComponent(id)}`, {
        method:'PATCH', body: JSON.stringify(body)
      });
      toast(`계획을 고쳤습니다. 이전 내용 ${r.historyCount}건이 이력에 남아 있습니다.`);
    }else{
      const r = await api('/api/plans', {method:'POST', body: JSON.stringify(body)});
      if(r.warning) toast(r.warning, true);
      else toast('계획을 저장했습니다.');
      state.currentPlanId = r.plan.id;
    }
    closeModal('plan-modal');
    await loadPlans();
    if(state.currentPlanId) selectPlan(state.currentPlanId);
  }catch(err){
    showErr('plan-modal-err', err.message);
  }finally{
    btn.disabled = false;
  }
}

async function deletePlan(id){
  if(!confirm('이 계획과 거기 딸린 할 일을 모두 지웁니다. 계속할까요?')) return;
  try{
    await api(`/api/plans?id=${encodeURIComponent(id)}`, {method:'DELETE'});
    if(state.currentPlanId === id) state.currentPlanId = null;
    toast('계획을 지웠습니다.');
    await loadPlans();
  }catch(e){ toast(e.message, true); }
}

async function showHistory(id){
  openModal('hist-modal');
  const body = document.getElementById('hist-body');
  body.innerHTML = '<div class="loading">불러오는 중…</div>';
  try{
    const data = await api(`/api/plans?id=${encodeURIComponent(id)}&history=1`);
    const h = data.history || [];
    if(h.length === 0){
      body.innerHTML = '<div class="empty">아직 고친 적이 없습니다. 계획을 한 번 고치면 고치기 전 내용이 여기에 남습니다.</div>';
      return;
    }
    body.innerHTML = h.map((v, i) => `
      <div class="hist">
        <div class="when">${esc(String(h.length - i))}번째 이전 버전 · ${esc(fmtDateTime(v.recordedAt))}에 이력으로 남음</div>
        <div style="font-weight:600">${esc(v.title)}</div>
        ${v.content ? `<div style="font-size:.8rem;color:var(--ink-soft);white-space:pre-wrap;margin-top:3px">${esc(v.content)}</div>` : ''}
        <div style="color:var(--ink-soft);font-size:.8rem;margin-top:3px">
          ${esc(v.startDate)} ~ ${esc(v.endDate)} ·
          우선순위 ${esc(PRIORITY_LABEL[v.priority] || v.priority)} ·
          예상 ${Number(v.estimatedHours)}시간
        </div>
        <div style="font-size:.8rem;margin-top:3px">${esc(v.successCriteria)}</div>
      </div>
    `).join('');
  }catch(e){
    body.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

/* ============================================================
   2. 할 일
   ============================================================ */
let _taskTimer = null;
function debouncedLoadTasks(){
  clearTimeout(_taskTimer);
  _taskTimer = setTimeout(loadTasks, 280);
}

async function loadTasks(){
  if(!state.currentPlanId) return;
  const el = document.getElementById('task-list');
  el.innerHTML = '<div class="loading">불러오는 중…</div>';

  const params = new URLSearchParams();
  const sort = document.getElementById('f-sort').value;

  if(state.drillIds){
    // 집계 숫자를 눌러 좁혀 본 상태 — id 목록으로만 조회한다.
    params.set('ids', state.drillIds.join(','));
    params.set('sort', sort);
  }else{
    params.set('planId', state.currentPlanId);
    params.set('sort', sort);
    const q = document.getElementById('f-q').value.trim();
    if(q) params.set('q', q);
    const st = document.getElementById('f-status').value;
    if(st) params.set('status', st);
    const pr = document.getElementById('f-priority').value;
    if(pr) params.set('priority', pr);
  }

  try{
    const data = await api('/api/tasks?' + params.toString());
    state.tasks = data.tasks || [];
    renderSortNote(data);
    renderTasks();
  }catch(e){
    el.innerHTML = `<div class="err">할 일을 불러오지 못했습니다. ${esc(e.message)}</div>`;
  }
}

/* 정렬·거르기 기준을 화면에 밝혀 둔다 (T06-C20) */
function renderSortNote(data){
  const parts = [];
  parts.push(`정렬: <b>${esc(data.sortLabel || '만든 날짜 최신순')}</b>`);

  if(state.drillIds){
    parts.push(`<span class="drill-tag">『${esc(state.drillLabel)}』 ${state.drillIds.length}건만 보는 중</span>
      <button class="btn-text" style="margin-left:6px;padding:0" onclick="clearDrill()">전체 보기로</button>`);
  }else{
    const f = data.appliedFilters || {};
    const applied = [];
    if(f.q) applied.push(`검색어 “${esc(f.q)}”`);
    if(f.status) applied.push(`상태 ${esc({todo:'진행 중',done:'완료',delayed:'지연',blocked:'막힘'}[f.status] || f.status)}`);
    if(f.priority) applied.push(`우선순위 ${esc(PRIORITY_LABEL[f.priority] || f.priority)}`);
    if(f.tag) applied.push(`태그 ${esc(f.tag)}`);
    if(applied.length) parts.push(`거르기: <b>${applied.join(' · ')}</b>`);
  }
  if(data.today) parts.push(`지연 판정 기준일(서울): <b>${esc(data.today)}</b>`);

  document.getElementById('sort-note').innerHTML = parts.join(' &nbsp;·&nbsp; ');
}

function renderTasks(){
  const el = document.getElementById('task-list');
  if(state.tasks.length === 0){
    el.innerHTML = state.drillIds
      ? '<div class="empty">해당하는 기록이 없습니다.</div>'
      : '<div class="empty">아직 할 일이 없습니다. 이 계획을 이루려면 실제로 무엇을 해야 하는지 적어 보세요.</div>';
    return;
  }

  el.innerHTML = state.tasks.map(t => {
    const expanded = state.expandedLogs.has(t.id);
    return `
    <div class="task pri-${esc(t.priority)} ${t.isCompleted ? 'done' : ''}" id="task-${esc(t.id)}">
      <div class="task-head">
        <div style="flex:1;min-width:0">
          <div class="task-text"><span class="check ${t.isCompleted ? 'on' : ''}"></span>${esc(t.content)}</div>
          <div class="task-meta">
            <span class="meta-field"><span class="dot dot-${esc(t.priority)}"></span>${esc(PRIORITY_LABEL[t.priority] || t.priority)}</span>
            ${t.dueDate ? `<span>마감 ${esc(t.dueDate)}</span>` : `<span style="color:var(--ink-faint)">마감일 없음</span>`}
            ${t.isDelayed ? '<span class="meta-field"><span class="dot dot-late"></span>지연</span>' : ''}
            ${t.hasBlocker ? '<span class="meta-field"><span class="dot dot-block"></span>막힘</span>' : ''}
            <span>예상 ${Number(t.estimatedHours)}h · 실제 ${Number(t.actualHours)}h</span>
            ${(t.tags || []).map(g => `<span class="tag">${esc(g)}</span>`).join('')}
          </div>
        </div>
        <div class="task-acts">
          <button class="btn-sm" onclick="openLogModal('${esc(t.id)}')">+ 실행 기록</button>
          ${t.isCompleted
            ? `<button class="btn-sm" onclick="toggleTask('${esc(t.id)}','reopen')">되돌리기</button>`
            : `<button class="btn-sm" onclick="toggleTask('${esc(t.id)}','complete')">완료</button>`}
          <button class="btn-sm" onclick="openTaskModal('${esc(t.id)}')">수정</button>
          <button class="btn-danger-sm" onclick="deleteTask('${esc(t.id)}')">삭제</button>
        </div>
      </div>
      ${t.logCount > 0 ? `
        <div class="logs">
          <button class="btn-text" style="padding:0" onclick="toggleLogs('${esc(t.id)}')">
            ${expanded ? '▾' : '▸'} 실행 기록 ${Number(t.logCount)}건
          </button>
          <div id="logs-${esc(t.id)}">${expanded ? '<div class="loading">불러오는 중…</div>' : ''}</div>
        </div>` : ''}
    </div>`;
  }).join('');

  // 펼쳐 둔 기록은 다시 그린 뒤에도 그대로 펼쳐 둔다.
  state.expandedLogs.forEach(id => {
    if(state.tasks.some(t => t.id === id)) fetchLogs(id);
  });
}

function openTaskModal(id = null){
  if(!state.currentPlanId){ toast('먼저 계획을 고르세요.', true); return; }
  showErr('task-modal-err', '');
  document.getElementById('task-form').reset();
  document.getElementById('t-id').value = id || '';

  if(id){
    const t = state.tasks.find(x => x.id === id);
    if(!t) return;
    document.getElementById('task-modal-title').textContent = '할 일 수정';
    document.getElementById('t-content').value = t.content;
    document.getElementById('t-due').value = t.dueDate || '';
    document.getElementById('t-priority').value = t.priority;
    document.getElementById('t-hours').value = t.estimatedHours;
    document.getElementById('t-tags').value = (t.tags || []).join(', ');
  }else{
    document.getElementById('task-modal-title').textContent = '새 할 일';
    document.getElementById('t-hours').value = 0;
  }
  openModal('task-modal');
}

async function saveTask(e){
  e.preventDefault();
  const btn = document.getElementById('t-submit');
  btn.disabled = true;
  showErr('task-modal-err', '');

  const id = document.getElementById('t-id').value;
  const body = {
    planId: state.currentPlanId,
    content: document.getElementById('t-content').value,
    dueDate: document.getElementById('t-due').value || null,
    priority: document.getElementById('t-priority').value,
    estimatedHours: parseFloat(document.getElementById('t-hours').value) || 0,
    tags: document.getElementById('t-tags').value,
  };

  try{
    if(id){
      await api(`/api/tasks?id=${encodeURIComponent(id)}`, {method:'PATCH', body: JSON.stringify(body)});
      toast('할 일을 고쳤습니다.');
    }else{
      await api('/api/tasks', {method:'POST', body: JSON.stringify(body)});
      toast('할 일을 만들었습니다.');
    }
    closeModal('task-modal');
    await refreshAfterChange();
  }catch(err){
    showErr('task-modal-err', err.message);
  }finally{
    btn.disabled = false;
  }
}

async function toggleTask(id, action){
  try{
    const r = await api(`/api/tasks?id=${encodeURIComponent(id)}`, {
      method:'PATCH', body: JSON.stringify({action})
    });
    if(r.alreadyCompleted) toast('이미 완료된 할 일입니다. 완료는 한 번만 기록됩니다.');
    else toast(action === 'complete' ? '완료로 바꿨습니다.' : '진행 중으로 되돌렸습니다.');
    await refreshAfterChange();
  }catch(e){ toast(e.message, true); }
}

async function deleteTask(id){
  if(!confirm('이 할 일을 지울까요? 딸린 실행 기록도 함께 지워집니다.')) return;
  try{
    await api(`/api/tasks?id=${encodeURIComponent(id)}`, {method:'DELETE'});
    toast('할 일을 지웠습니다.');
    await refreshAfterChange();
  }catch(e){ toast(e.message, true); }
}

/* ============================================================
   3. 실행 기록 (Do)
   ============================================================ */
function toggleLogs(taskId){
  if(state.expandedLogs.has(taskId)) state.expandedLogs.delete(taskId);
  else state.expandedLogs.add(taskId);
  renderTasks();
}

async function fetchLogs(taskId){
  const box = document.getElementById(`logs-${taskId}`);
  if(!box) return;
  try{
    const data = await api(`/api/task-logs?taskId=${encodeURIComponent(taskId)}`);
    const logs = data.logs || [];
    state.logsByTask[taskId] = logs;
    if(logs.length === 0){ box.innerHTML = '<div style="font-size:.78rem;color:var(--ink-faint);padding:8px 0">기록이 없습니다.</div>'; return; }
    box.innerHTML = logs.map(l => `
      <div class="log">
        <div class="log-row">
          <div style="flex:1;min-width:0">
            ${l.content ? `<div class="log-content">${esc(l.content)}</div>` : ''}
            ${esc(fmtDateTime(l.startedAt))} → ${esc(fmtDateTime(l.endedAt))}
            · 실제 <b>${Number(l.actualHours)}시간</b>
            ${l.blockerReason ? `<span class="log-blk">막힘 — ${esc(l.blockerReason)}</span>` : ''}
          </div>
          <div style="display:flex;gap:2px;flex-shrink:0">
            <button class="btn-sm" onclick="openLogModal('${esc(l.taskId)}','${esc(l.id)}')">수정</button>
            <button class="btn-danger-sm" onclick="deleteLog('${esc(l.taskId)}','${esc(l.id)}')">삭제</button>
          </div>
        </div>
      </div>
    `).join('');
  }catch(e){
    box.innerHTML = `<div style="font-size:.78rem;color:var(--bad);padding:8px 0">기록을 불러오지 못했습니다.</div>`;
  }
}

function openLogModal(taskId, logId = null){
  const t = state.tasks.find(x => x.id === taskId);
  showErr('log-modal-err', '');
  document.getElementById('log-form').reset();
  document.getElementById('l-task-id').value = taskId;
  document.getElementById('l-id').value = logId || '';
  document.getElementById('log-modal-sub').textContent = t ? `할 일: ${t.content}` : '';

  // "실제로 한 일" 기록이라 미래 시각은 애초에 고를 수 없게 막는다. (서버도 같은 규칙으로 다시 검증한다)
  const nowLocal = toLocalInput(new Date());
  document.getElementById('l-start').max = nowLocal;
  document.getElementById('l-end').max = nowLocal;

  const existing = logId ? (state.logsByTask[taskId] || []).find(l => l.id === logId) : null;

  if(existing){
    // 수정 모드 — 완료 상태를 이 화면에서 함께 바꾸지 않는다. 완료/되돌리기는 할 일 카드의 버튼으로 한다.
    document.getElementById('log-modal-title').textContent = '실행 기록 수정';
    document.getElementById('l-submit').textContent = '수정 저장';
    document.getElementById('l-complete-row').style.display = 'none';
    document.getElementById('l-content').value = existing.content || '';
    document.getElementById('l-start').value = toLocalInput(new Date(existing.startedAt));
    document.getElementById('l-end').value = toLocalInput(new Date(existing.endedAt));
    document.getElementById('l-hours').value = existing.actualHours;
    document.getElementById('l-blocker').value = existing.blockerReason || '';
  }else{
    document.getElementById('log-modal-title').textContent = '실제로 한 일 기록';
    document.getElementById('l-submit').textContent = '기록 저장';
    document.getElementById('l-complete-row').style.display = '';

    // 같은 요청을 알아보는 키를 모달을 열 때 한 번만 만든다.
    // 저장 버튼을 연달아 눌러도 같은 키가 가므로, 두 번째는 데이터베이스가 막는다. (T06-C21)
    document.getElementById('l-key').value =
      (crypto.randomUUID ? crypto.randomUUID() : 'k-' + Date.now() + '-' + Math.random().toString(36).slice(2));

    // 기본값: 한 시간 전 ~ 지금
    const now = new Date();
    const before = new Date(now.getTime() - 3600_000);
    document.getElementById('l-start').value = toLocalInput(before);
    document.getElementById('l-end').value = toLocalInput(now);
    document.getElementById('l-hours').value = 1;
    document.getElementById('l-complete').checked = t ? !t.isCompleted : true;
    document.getElementById('l-content').value = '';
  }

  openModal('log-modal');
}

function toLocalInput(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* 시작·끝 시각을 넣으면 걸린 시간을 자동으로 채운다. */
function syncLogHours(){
  const s = document.getElementById('l-start').value;
  const e = document.getElementById('l-end').value;
  if(!s || !e) return;
  const diff = (new Date(e) - new Date(s)) / 3600_000;
  if(diff >= 0) document.getElementById('l-hours').value = Math.round(diff * 4) / 4;
}

async function saveLog(e){
  e.preventDefault();
  const btn = document.getElementById('l-submit');
  btn.disabled = true;
  showErr('log-modal-err', '');

  const taskId = document.getElementById('l-task-id').value;
  const logId = document.getElementById('l-id').value;

  const body = {
    content: document.getElementById('l-content').value,
    startedAt: new Date(document.getElementById('l-start').value).toISOString(),
    endedAt: new Date(document.getElementById('l-end').value).toISOString(),
    actualHours: parseFloat(document.getElementById('l-hours').value) || 0,
    blockerReason: document.getElementById('l-blocker').value.trim() || null,
  };

  try{
    if(logId){
      // 수정 — idempotency 키는 생성 시점 전용이라 여기선 필요 없다.
      await api(`/api/task-logs?id=${encodeURIComponent(logId)}`, {
        method:'PATCH', body: JSON.stringify(body)
      });
      toast('실행 기록을 고쳤습니다.');
    }else{
      body.taskId = taskId;
      body.idempotencyKey = document.getElementById('l-key').value;
      const r = await api('/api/task-logs', {method:'POST', body: JSON.stringify(body)});

      if(r.duplicate){
        toast('같은 기록이 이미 저장되어 있습니다. 기록은 한 건만 남습니다.');
      }else{
        toast('실행 기록을 저장했습니다. 계획 값은 그대로입니다.');
      }

      // 완료 처리는 별도 요청. 이미 완료면 서버가 다시 쓰지 않는다.
      if(document.getElementById('l-complete').checked){
        await api(`/api/tasks?id=${encodeURIComponent(taskId)}`, {
          method:'PATCH', body: JSON.stringify({action:'complete'})
        });
      }
    }

    closeModal('log-modal');
    state.expandedLogs.add(taskId);
    await refreshAfterChange();
  }catch(err){
    showErr('log-modal-err', err.message);
  }finally{
    btn.disabled = false;
  }
}

async function deleteLog(taskId, logId){
  if(!confirm('이 실행 기록을 지울까요?')) return;
  try{
    await api(`/api/task-logs?id=${encodeURIComponent(logId)}`, {method:'DELETE'});
    toast('실행 기록을 지웠습니다.');
    await refreshAfterChange();
    await fetchLogs(taskId);
  }catch(e){ toast(e.message, true); }
}

/* ============================================================
   4. 돌아보기 (See)
   ============================================================ */
async function loadSummary(){
  if(!state.currentPlanId) return;
  const el = document.getElementById('summary-area');
  el.innerHTML = '<div class="loading">집계 중…</div>';
  try{
    const data = await api(`/api/summary?planId=${encodeURIComponent(state.currentPlanId)}`);
    state.summary = data;
    renderSummary(data);
  }catch(e){
    el.innerHTML = `<div class="err">집계를 불러오지 못했습니다. ${esc(e.message)}</div>`;
  }
}

function renderSummary(d){
  const c = d.counts || {};
  const h = d.hours || {estimated:0, actual:0, diff:0};
  const stat = (key, label, hint) => {
    const item = c[key] || {value:0, taskIds:[]};
    return `
      <button class="stat" onclick="drillDown('${esc(key)}','${esc(label)}')" title="눌러서 이 숫자가 나온 기록 보기">
        <div class="n">${Number(item.value)}</div>
        <div class="l">${esc(label)}</div>
        <div class="hint">${esc(hint)}</div>
      </button>`;
  };

  const diff = Number(h.diff);
  const diffColor = diff > 0 ? 'var(--bad)' : (diff < 0 ? 'var(--good)' : 'var(--ink)');
  const diffText = diff > 0 ? `+${diff} · 예상보다 더 걸림` : (diff < 0 ? `${diff} · 예상보다 덜 걸림` : '0 · 예상과 같음');

  document.getElementById('summary-area').innerHTML = `
    <div class="stats">
      ${stat('plan','계획 수','딸린 할 일')}
      ${stat('completed','완료 수','지금 완료 상태')}
      ${stat('delayed','지연 수',`마감 &lt; ${esc(d.today || '')}`)}
      ${stat('blocked','막힘 수','막힌 이유 있음')}
    </div>
    <div class="hours-row">
      <div class="h-item"><div class="n">${Number(h.estimated)}시간</div><div class="l">예상 시간 합계</div></div>
      <div class="h-item"><div class="n">${Number(h.actual)}시간</div><div class="l">실제 시간 합계</div></div>
      <div class="h-item"><div class="n" style="color:${diffColor}">${esc(diffText)}</div><div class="l">차이 (실제 − 예상)</div></div>
    </div>
  `;
}

/* 집계 숫자를 눌러 그 숫자가 나온 기록으로 간다 (T06-C83) */
function drillDown(key, label){
  const item = (state.summary?.counts || {})[key];
  if(!item || !item.taskIds || item.taskIds.length === 0){
    toast('이 숫자에 해당하는 기록이 없습니다.');
    return;
  }
  state.drillIds = item.taskIds;
  state.drillLabel = label;
  switchTab('do');
  loadTasks();
  document.getElementById('panel-do').scrollIntoView({behavior:'smooth', block:'start'});
}

function clearDrill(){
  state.drillIds = null;
  state.drillLabel = '';
  loadTasks();
}

async function loadRetros(){
  if(!state.currentPlanId) return;
  try{
    const data = await api(`/api/retrospectives?planId=${encodeURIComponent(state.currentPlanId)}`);
    state.retros = data.retrospectives || [];
    renderRetros();

    document.getElementById('retro-list').innerHTML = '';

}

            </div>` : ''}

async function saveRetro(e){
  e.preventDefault();

  const retroId = document.getElementById('r-id').value;
  const body = {
    planId: state.currentPlanId,
    periodStart: document.getElementById('r-start').value,
    periodEnd: document.getElementById('r-end').value,
    status: document.getElementById('r-status').value,
    reflection: document.getElementById('r-reflection').value,
    nextActionItem: document.getElementById('r-next').value,
  };

  try{
    if(retroId){
      await api(`/api/retrospectives?id=${encodeURIComponent(retroId)}`, {
        method:'PATCH',
        body: JSON.stringify(body)
      });
      toast('돌아보기를 수정했습니다.');
    }else{
      await api('/api/retrospectives', {
        method:'POST',
        body: JSON.stringify(body)
      });
      toast('돌아보기를 저장했습니다.');
    }

    cancelRetroEdit();
    await loadRetros();
  }catch(err){
    toast(err.message, true);
  }
}

function editRetro(retroId){
  const r = state.retros.find(x => x.id === retroId);
  if(!r) return;

  document.getElementById('r-id').value = r.id;
  document.getElementById('r-start').value = r.periodStart || '';
  document.getElementById('r-end').value = r.periodEnd || '';
  document.getElementById('r-status').value = r.status || 'PARTIAL';
  document.getElementById('r-reflection').value = r.reflection || '';
  document.getElementById('r-next').value = r.nextActionItem || '';

  document.getElementById('retro-submit-btn').textContent = '돌아보기 수정';
  document.getElementById('retro-cancel-btn').style.display = 'inline-block';

  document.getElementById('retro-form').scrollIntoView({behavior:'smooth', block:'start'});
  document.getElementById('r-reflection').focus();
}

function cancelRetroEdit(){
  document.getElementById('r-id').value = '';
  document.getElementById('retro-form').reset();
  document.getElementById('retro-submit-btn').textContent = '돌아보기 저장';
  document.getElementById('retro-cancel-btn').style.display = 'none';

  // 새 돌아보기 입력의 기본값
  document.getElementById('r-status').value = 'PARTIAL';
}

async function deleteRetro(retroId){
  const r = state.retros.find(x => x.id === retroId);
  if(!r) return;

  if(!confirm('이 돌아보기를 삭제할까요? 삭제하면 되돌릴 수 없습니다.')) return;

  try{
    await api(`/api/retrospectives?id=${encodeURIComponent(retroId)}`, {
      method:'DELETE'
    });

    if(document.getElementById('r-id').value === retroId){
      cancelRetroEdit();
    }

    toast('돌아보기를 삭제했습니다.');
    await loadRetros();
  }catch(err){
    toast(err.message, true);
  }
}

/* 돌아보기의 고칠 점을 다음 계획으로 넘긴다 (T06-C33) */
function carryToNextPlan(retroId){
  const r = state.retros.find(x => x.id === retroId);
  if(!r) return;
  openPlanModal(null, retroId);
  document.getElementById('p-success').value = r.nextActionItem || '';
  document.getElementById('p-title').focus();
  toast('고칠 점을 성공 기준에 옮겨 담았습니다. 계획을 마저 채우세요.');
}

/* ============================================================
   내보내기 (T06-C36)
   ============================================================ */
async function exportAll(){
  try{
    const data = await api('/api/export');
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `plandosee-export-${seoulToday()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('내 자료 전체를 파일 하나로 내보냈습니다.');
  }catch(e){
    toast(`내보내기에 실패했습니다. ${e.message}`, true);
  }
}

/* ============================================================
   공통
   ============================================================ */
async function refreshAfterChange(){
  // 드릴다운은 그 순간의 스냅샷이라, 이후 변경이 생기면 낡은 목록이 된다.
  // 새로 추가된 항목이 안 보이는 걸 막기 위해 변경이 생기면 전체 목록으로 되돌린다.
  if(state.drillIds){
    state.drillIds = null;
    state.drillLabel = '';
  }
  await Promise.all([loadTasks(), loadSummary()]);
  // 계획 목록의 할 일 수·완료 수도 다시 센다.
  try{
    const data = await api('/api/plans');
    state.plans = data.plans || [];
    renderPlans();
    // 헤더의 계획도 최신 카운트로 다시 그린다.
    const plan = state.plans.find(p => p.id === state.currentPlanId);
    if(plan) renderPlanHeader(plan);
  }catch{ /* 목록 갱신 실패는 조용히 넘어간다 */ }
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('l-start').addEventListener('change', syncLogHours);
  document.getElementById('l-end').addEventListener('change', syncLogHours);

  // 모달은 Esc 로도 닫는다.
  document.addEventListener('keydown', ev => {
    if(ev.key === 'Escape'){
      document.querySelectorAll('.modal-bg.open').forEach(m => m.classList.remove('open'));
    }
  });

  loadPlans();
});
</script>
